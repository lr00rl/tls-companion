<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A TLS study workbench. Replay real TLS 1.2 and 1.3 handshakes and follow the bytes, the key schedule, the Go crypto/tls source and call trace, the RFCs, and the notes." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://lr00rl.github.io/tls-companion/" />
    <link rel="sitemap" type="application/xml" href="https://lr00rl.github.io/tls-companion/sitemap.xml" />
    <link rel="icon" type="image/svg+xml" href="/tls-companion/favicon.svg" />
    <meta property="og:title" content="TLS Companion · Interactive TLS Workbench" />
    <meta property="og:description" content="Replay real TLS handshakes and inspect every byte, secret, Go call, RFC section, and explanatory note." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lr00rl.github.io/tls-companion/" />
    <meta property="og:image" content="https://lr00rl.github.io/tls-companion/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TLS Companion · Interactive TLS Workbench" />
    <meta name="twitter:description" content="Replay real TLS handshakes and inspect every byte, secret, Go call, RFC section, and explanatory note." />
    <meta name="twitter:image" content="https://lr00rl.github.io/tls-companion/og-card.png" />
    <meta name="twitter:image:alt" content="TLS Companion, an interactive workbench for protocol bytes, keys, source code, RFCs, and notes" />
    <title>TLS Companion</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TLS Companion",
        "url": "https://lr00rl.github.io/tls-companion/",
        "description": "An interactive study workbench for TLS handshakes, protocol bytes, key schedules, Go crypto/tls source, RFCs, and bilingual notes.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": ["en", "zh-CN"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "sameAs": "https://github.com/lr00rl/tls-companion"
      }
    </script>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("tlsc.theme") || '"system"');
        if (t !== "system") document.documentElement.dataset.theme = t;
        var l = JSON.parse(localStorage.getItem("tlsc.lang") || '"en"');
        if (l === "zh") document.documentElement.lang = "zh-CN";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>TLS Companion requires JavaScript for the interactive workbench. The <a href="/tls-companion/learn/en/">English notes</a> and <a href="/tls-companion/learn/zh/">Chinese notes</a> are also available as static pages.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
