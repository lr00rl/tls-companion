<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A TLS study workbench. Replay real TLS 1.2 and 1.3 handshakes and follow the bytes, the key schedule, the Go crypto/tls source and call trace, the RFCs, and the notes." />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='7' width='4' height='8' rx='1' fill='%238a8f98'/%3E%3Crect x='6' y='1' width='4' height='14' rx='1' fill='%23c2386f'/%3E%3Crect x='11' y='4' width='4' height='11' rx='1' fill='%232f8f5b'/%3E%3C/svg%3E" />
    <title>TLS Companion</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("tlsc.theme") || '"system"');
        if (t !== "system") document.documentElement.dataset.theme = t;
        var l = JSON.parse(localStorage.getItem("tlsc.lang") || '"en"');
        if (l === "zh") document.documentElement.lang = "zh-CN";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
